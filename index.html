<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Friend Escape</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen">
        <div class="content">
            <h1>THE MAZE</h1>
            <p>They are waiting for you.</p>
            <button id="start-button">ENTER MAZE</button>
            <div class="controls">
                WASD to Move | Arrows to Rotate | Shift to Sprint
            </div>
        </div>
    </div>

    <div id="ui" style="display: none;">
        <p>FIND THE EXIT</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
